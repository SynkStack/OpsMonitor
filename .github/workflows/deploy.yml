name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # DEPLOY_TOKEN is never added to the repo secrets, so this job fails
      - name: Check deploy token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is not set"
            exit 1
          fi
      - name: Deploy
        run: echo "Deploying opsmonitor..."